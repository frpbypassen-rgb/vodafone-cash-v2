name: Ahram Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  NODE_ENV: test
  JWT_SECRET: ahram-ci-cd-test-secret-key-2026-must-be-32-chars
  JWT_REFRESH_SECRET: ahram-ci-cd-refresh-secret-key-2026-must-be-32-chars
  SESSION_SECRET: ahram-ci-cd-session-secret-2026-must-be-32-chars
  OTP_SECRET: ahram-ci-cd-otp-secret-2026-must-be-32-chars

jobs:
  # ═══════════════════════════════════════════════
  #  1️⃣ فحص جودة الكود (Lint + Format)
  # ═══════════════════════════════════════════════
  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

  # ═══════════════════════════════════════════════
  #  2️⃣ فحص الأمان (Security Audit)
  # ═══════════════════════════════════════════════
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run production dependency audit
      run: npm audit --omit=dev --audit-level=high

    - name: Run security regression tests
      run: npm run test:security

  # ═══════════════════════════════════════════════
  #  3️⃣ اختبارات الوحدة + تقرير التغطية
  # ═══════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Unit Tests with Coverage
      run: npx jest --coverage --coverageReporters=text --coverageReporters=lcov --forceExit --detectOpenHandles
      env:
        JWT_SECRET: ${{ env.JWT_SECRET }}
        JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

    - name: Upload Coverage Report
      if: matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

  # ═══════════════════════════════════════════════
  #  4️⃣ بناء صورة Docker
  # ═══════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t ahram-core-api:${{ github.sha }} .

    - name: Test Docker Image
      run: |
        set -euo pipefail
        cleanup() { docker rm -f ahram-test >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        docker run -d --name ahram-test --network host \
          -e PORT=3080 \
          -e MONGO_URI="mongodb://127.0.0.1:27017/ahram-docker-ci" \
          -e JWT_SECRET="${{ env.JWT_SECRET }}" \
          -e JWT_REFRESH_SECRET="${{ env.JWT_REFRESH_SECRET }}" \
          -e SESSION_SECRET="${{ env.SESSION_SECRET }}" \
          -e OTP_SECRET="${{ env.OTP_SECRET }}" \
          -e FORCE_CLIENT_OTP=true \
          -e BYPASS_OTP=false \
          -e BYPASS_CLIENT_OTP=false \
          -e SECURE_COOKIE=true \
          -e SESSION_STORE=mongo \
          -e MONGO_TRANSACTIONS_REQUIRED=true \
          -e TENANT_ISOLATION_REQUIRED=true \
          -e TENANT_MODE=single \
          -e DEFAULT_TENANT_SLUG=ahram \
          -e ALLOW_LEGACY_TENANTLESS_RECORDS=false \
          -e ALLOW_LEGACY_TENANT_TOKENS=false \
          -e PUBLIC_APP_URL=https://ci.invalid \
          -e REDIS_ENABLED=false \
          -e REDIS_REQUIRED=false \
          -e NODE_ENV=production \
          ahram-core-api:${{ github.sha }}
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:3080/health >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        docker logs ahram-test
        exit 1

    - name: Tag Latest (main branch only)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: docker tag ahram-core-api:${{ github.sha }} ahram-core-api:latest

  # ═══════════════════════════════════════════════
  #  5️⃣ ملخص النتائج
  # ═══════════════════════════════════════════════
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests, docker-build]
    if: always()

    steps:
    - name: Generate Summary
      run: |
        echo "## 📊 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| 🧹 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔒 Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🐳 Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

    - name: Enforce successful pipeline
      if: needs.lint.result != 'success' || needs.security.result != 'success' || needs.unit-tests.result != 'success' || needs.docker-build.result != 'success'
      run: exit 1
