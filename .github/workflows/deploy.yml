name: Deploy to Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to production server
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_RESTART_COMMAND: ${{ secrets.DEPLOY_RESTART_COMMAND }}
      DEPLOY_SYSTEMD_SERVICE: ${{ secrets.DEPLOY_SYSTEMD_SERVICE }}
      APP_RUNTIME_ENV_BASE64: ${{ secrets.APP_RUNTIME_ENV_BASE64 }}
      DEPLOY_SHA: ${{ github.sha }}
      REPO_URL: https://github.com/${{ github.repository }}.git

    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::$name secret is not configured"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Deployment skipped because required server secrets are missing."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment script
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SHA:?DEPLOY_SHA is required}"
          : "${REPO_URL:?REPO_URL is required}"
          RUNTIME_ENV_FILE=/tmp/vodafone-cash-deploy/runtime.env

          cleanup_runtime_env() {
            rm -f "$RUNTIME_ENV_FILE"
          }
          trap cleanup_runtime_env EXIT

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            git clone "$REPO_URL" "$DEPLOY_PATH"
          fi

          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout main
          git reset --hard "$DEPLOY_SHA"

          npm ci --omit=dev

          if [ -s "$RUNTIME_ENV_FILE" ]; then
            RUNTIME_ENV_FILE="$RUNTIME_ENV_FILE" node <<'NODE'
          const fs = require('fs');

          const sourcePath = process.env.RUNTIME_ENV_FILE;
          const targetPath = '.env';
          const allowedKeys = new Set([
            'WHATCHIMP_ENABLED',
            'WHATCHIMP_API_TOKEN',
            'WHATCHIMP_PHONE_NUMBER_ID',
            'WHATCHIMP_OTP_TEMPLATE',
            'WHATCHIMP_OTP_TEMPLATE_LANGUAGE',
            'WHATCHIMP_RECEIPT_MEDIA_TEMPLATE_ID',
            'WHATCHIMP_RECEIPT_TEMPLATE',
            'WHATCHIMP_RECEIPT_TEMPLATE_LANGUAGE',
            'WHATCHIMP_WEBHOOK_SECRET',
            'PUBLIC_APP_URL',
            'WEB_PUSH_PUBLIC_KEY',
            'WEB_PUSH_PRIVATE_KEY',
            'WEB_PUSH_SUBJECT',
            'RECEIPT_SHARE_SECRET',
            'FCM_ENABLED',
            'FIREBASE_SERVICE_ACCOUNT_BASE64',
            'FIREBASE_PROJECT_ID',
            'FIREBASE_CLIENT_EMAIL',
            'FIREBASE_PRIVATE_KEY',
            'FCM_WORKER_INTERVAL_MS',
            'EXECUTOR_PUSH_REMINDER_INTERVAL_MS',
            'EXECUTOR_PUSH_MAX_REMINDERS',
            'FCM_DEVICE_ACTIVE_DAYS',
            'EXECUTOR_LOW_BALANCE_THRESHOLD'
          ]);

          const updates = new Map();
          const source = fs.readFileSync(sourcePath, 'utf8').replace(/^\uFEFF/, '');
          for (const [lineNumber, rawLine] of source.split(/\r?\n/).entries()) {
            if (!rawLine.trim() || rawLine.trim().startsWith('#')) continue;

            const separator = rawLine.indexOf('=');
            if (separator < 1) throw new Error(`Invalid runtime environment entry at line ${lineNumber + 1}`);

            const key = rawLine.slice(0, separator).trim();
            const value = rawLine.slice(separator + 1).replace(/\r$/, '');
            if (!allowedKeys.has(key)) throw new Error(`Runtime environment key is not allowed: ${key}`);
            updates.set(key, value);
          }

          if (updates.size) {
            const existing = fs.existsSync(targetPath) ? fs.readFileSync(targetPath, 'utf8') : '';
            const lines = existing ? existing.split(/\r?\n/) : [];
            const written = new Set();
            const nextLines = lines.map((line) => {
              const match = /^([A-Za-z_][A-Za-z0-9_]*)=/.exec(line);
              if (!match || !updates.has(match[1])) return line;
              written.add(match[1]);
              return `${match[1]}=${updates.get(match[1])}`;
            });

            for (const [key, value] of updates) {
              if (!written.has(key)) nextLines.push(`${key}=${value}`);
            }

            fs.writeFileSync(targetPath, `${nextLines.filter((line, index, all) => line || index < all.length - 1).join('\n')}\n`, { mode: 0o600 });
          }
          NODE
          fi

          # Browser Push requires one stable VAPID key pair. Generate it once
          # on the server when absent; .env is preserved across git deploys.
          node scripts/ensureWebPushKeys.js
          chmod 600 .env

          if [ -n "${DEPLOY_RESTART_COMMAND:-}" ]; then
            bash -lc "$DEPLOY_RESTART_COMMAND"
          elif [ -f ecosystem.config.js ] && command -v pm2 >/dev/null 2>&1; then
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
          elif [ -n "${DEPLOY_SYSTEMD_SERVICE:-}" ] && command -v systemctl >/dev/null 2>&1; then
            sudo systemctl restart "$DEPLOY_SYSTEMD_SERVICE"
          else
            echo "No restart method configured. Set DEPLOY_RESTART_COMMAND, DEPLOY_SYSTEMD_SERVICE, or install pm2."
            exit 1
          fi
          REMOTE_SCRIPT

          {
            printf 'export DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            printf 'export DEPLOY_SHA=%q\n' "$DEPLOY_SHA"
            printf 'export REPO_URL=%q\n' "$REPO_URL"
            printf 'export DEPLOY_RESTART_COMMAND=%q\n' "${DEPLOY_RESTART_COMMAND:-}"
            printf 'export DEPLOY_SYSTEMD_SERVICE=%q\n' "${DEPLOY_SYSTEMD_SERVICE:-}"
          } > deploy.env

          if [ -n "${APP_RUNTIME_ENV_BASE64:-}" ]; then
            printf '%s' "$APP_RUNTIME_ENV_BASE64" | base64 --decode > runtime.env
            chmod 600 runtime.env
          else
            : > runtime.env
          fi

          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /tmp/vodafone-cash-deploy'
          scp -P "$DEPLOY_PORT" -i ~/.ssh/deploy_key deploy.sh deploy.env runtime.env "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vodafone-cash-deploy/"

      - name: Run deployment
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /tmp/vodafone-cash-deploy && chmod +x deploy.sh && source deploy.env && ./deploy.sh'
